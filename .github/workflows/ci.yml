name: CI - Pruebas automatizadas LumaTek

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  tests:
    name: PHPUnit (PHP 8.3, SQLite in memory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      APP_MAINTENANCE_DRIVER: file
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BROADCAST_CONNECTION: 'null'
      LOG_CHANNEL: 'null'
      BCRYPT_ROUNDS: '4'
      PULSE_ENABLED: 'false'
      TELESCOPE_ENABLED: 'false'
      NIGHTWATCH_ENABLED: 'false'
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verificar ausencia de archivos locales y caché de configuración
        shell: bash
        run: |
          test ! -e .env
          test ! -e .env.testing
          test ! -e bootstrap/cache/config.php

      - name: Preparar PHP y Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, xmlwriter, fileinfo, curl, zip, bcmath, intl, gd, pdo_sqlite, sqlite3, :pdo_mysql, :mysqli, :pdo_pgsql, :pgsql
          tools: composer:v2
          coverage: none

      - name: Generar clave temporal para las pruebas
        shell: bash
        run: php -r 'echo "APP_KEY=base64:".base64_encode(random_bytes(32)).PHP_EOL;' >> "$GITHUB_ENV"

      - name: Instalar dependencias del proyecto
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Comprobar requisitos del entorno
        run: composer check-platform-reqs

      - name: Verificar aislamiento y ejecutar migraciones en memoria
        shell: bash
        run: |
          php <<'PHP'
          <?php
          try {
              require 'vendor/autoload.php';

              $app = require 'bootstrap/app.php';
              if ($app->configurationIsCached()) {
                  throw new RuntimeException('No se permite usar configuración en caché durante las pruebas.');
              }
              $kernel = $app->make(Illuminate\Contracts\Console\Kernel::class);
              $kernel->bootstrap();

              if (!$app->environment('testing')
                  || config('database.default') !== 'sqlite'
                  || config('database.connections.sqlite.driver') !== 'sqlite'
                  || config('database.connections.sqlite.database') !== ':memory:'
                  || !in_array(config('database.connections.sqlite.url'), [null, ''], true)) {
                  throw new RuntimeException('Las pruebas requieren SQLite en memoria y ninguna URL de base de datos.');
              }
              if (Illuminate\Support\Facades\DB::getConnections() !== []) {
                  throw new RuntimeException('Se abrió una conexión a la base de datos antes de verificar el aislamiento.');
              }

              // Eliminamos las demás conexiones antes de ejecutar cualquier migración.
              config(['database.connections' => ['sqlite' => config('database.connections.sqlite')]]);
              $connection = Illuminate\Support\Facades\DB::connection('sqlite');
              if ($connection->getDriverName() !== 'sqlite' || $connection->getDatabaseName() !== ':memory:') {
                  throw new RuntimeException('Se detectó una conexión de base de datos inesperada.');
              }
              $databases = $connection->select('PRAGMA database_list');
              if ($databases === []) {
                  throw new RuntimeException('No se pudo verificar el aislamiento de SQLite.');
              }
              foreach ($databases as $database) {
                  if ($database->file !== '') {
                      throw new RuntimeException('No se permiten bases de datos guardadas en archivos durante las pruebas.');
                  }
              }

              $status = $kernel->call('migrate', ['--database' => 'sqlite', '--no-interaction' => true]);
              echo $kernel->output();
              exit($status);
          } catch (Throwable $exception) {
              file_put_contents('php://stderr', $exception->getMessage().PHP_EOL);
              exit(1);
          }
          PHP

      # Cada prueba de base de datos verifica el aislamiento antes de migrar
      # en SQLite en memoria. No se requiere compilar Node/Vite porque usan withoutVite().
      - name: Ejecutar pruebas automatizadas con PHPUnit
        run: php vendor/bin/phpunit --configuration phpunit.xml --testdox

      - name: Comunicar resultado del pipeline
        if: always()
        shell: bash
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Las comprobaciones y pruebas automatizadas finalizaron correctamente."
          else
            echo "Se detectaron fallos. Revisa el detalle de la etapa que produjo el error."
          fi
